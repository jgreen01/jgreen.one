name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The infra job talks to real AWS, so it only ever runs on demand.
  workflow_dispatch:
    inputs:
      run_infra_tests:
        description: "Also validate deployed AWS resources"
        type: boolean
        default: false

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Type-check, unit test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate guides
        run: node scripts/validate_guides.mjs

  build-integration:
    name: Build integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds twice (once with a temporary draft fixture) to prove drafts are
      # excluded from dist/ — kept out of the `build` job to keep that one fast.
      - name: Build output assertions
        run: npm run test:build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # A cache hit restores the binaries but not the apt packages they link
      # against, so system deps are installed either way.
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run E2E suite
        # WebKit is opt-in locally (its network process needs system libraries
        # that a plain `playwright install` does not provide); CI has them.
        env:
          E2E_WEBKIT: "1"
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    name: Infrastructure validation (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_infra_tests
    permissions:
      id-token: write # for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r tests/infra/requirements.txt

      # Requires an IAM role trusting this repo's OIDC provider, with read-only
      # access to CloudFront, S3, WAFv2, SNS, CloudWatch and Budgets. Set the
      # AWS_INFRA_ROLE_ARN secret to enable; the suite skips itself without it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate deployed resources
        run: pytest tests/infra -v
